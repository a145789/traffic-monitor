[package]
name = "traffic-monitor"
version = "1.8.0"
edition = "2024"
rust-version = "1.95"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# windows crate 在 panic=abort + codegen-units=1 时编译 OOM，提高并行度降低峰值内存
[profile.release.package.windows]
codegen-units = 8

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    # diag! 宏（debug 诊断输出）依赖 OutputDebugStringW
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Threading",
    # windows 0.62 中 UI::Shell 的 ShellExecuteExW/SHELLEXECUTEINFOW 实际由此 feature 门控
    "Win32_System_Registry",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock", # IpHelper::GetAdaptersAddresses 内部依赖此 feature
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_Graphics_Gdi",
    "Win32_System_RemoteDesktop",
]}
# 版本对齐约定：windows-registry 与上面 windows crate 的 windows-link/result/strings
# 家族必须同批（windows 0.62 ↔ 0.2.1/0.4.1/0.5.1，即 registry 0.6.x）。升 windows 到
# 新家族时同批把 registry 升回去，避免 lock 里并存两套基础 crate。
windows-registry = "0.100.0"


[build-dependencies]
# 本仓库无 [package.metadata.winresource] 表段，关闭默认 toml feature，
# 避免引入 toml/serde/syn 整条构建依赖链；未来要加该表段时再显式开启。
winresource = { version = "0.1", default-features = false }

[lints]
rust.unsafe_op_in_unsafe_fn = "deny"
clippy.enum_glob_use = "warn"
clippy.items_after_statements = "warn"
