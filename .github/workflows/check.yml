name: Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: check

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build release
        run: cargo build --release --locked

  # MSRV 对账：Cargo.toml 声明 rust-version = "1.95"，此处用 1.95 工具链跑
  # cargo check --locked，与最新 stable 并行。若红，在同一 PR 内决定
  # 「升 rust-version」还是「改代码」，不允许声明与 CI 静默脱节。
  msrv:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: msrv-1.95
          toolchain: "1.95"

      - name: Check MSRV
        run: cargo check --locked
