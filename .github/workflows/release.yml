name: Release

on:
  push:
    tags:
      - "v*"
  # 修复入口：默认 push-tag 路径不允许覆盖已存在的同名资产，一轮上传失败会在 release
  # 上留下 draft + 部分资产，重跑必须先显式声明 repair 才能清理同名资产。
  workflow_dispatch:
    inputs:
      repair:
        description: "修复模式：删除本次将要重传的同名旧资产后再上传（仅对 draft 生效，默认关闭）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # 三方一致校验：tag（GITHUB_REF_NAME 去 v 前缀）、Cargo.toml 版本、installer.iss 的 AppVersion
      # 必须全等，否则说明“元数据宣称新版本、装进去仍是旧程序”，直接失败。
      - name: Verify version consistency
        shell: bash
        env:
          # 经 env 传入而非 ${{ }} 内插进脚本，避免 tag 特殊字符造成 script-injection。
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          CARGO_VER="$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          ISS_VER="$(grep -m1 -E '^AppVersion=' installer.iss | cut -d= -f2 | tr -d '\r' | xargs)"
          echo "tag=${VERSION} Cargo.toml=${CARGO_VER} installer.iss=${ISS_VER}"
          if [ "${VERSION}" != "${CARGO_VER}" ] || [ "${VERSION}" != "${ISS_VER}" ]; then
            echo "Version mismatch: tag=${VERSION} Cargo.toml=${CARGO_VER} installer.iss=${ISS_VER}" >&2
            exit 1
          fi

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: release

      - name: Test release commit
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Cache Inno Setup
        id: cache-is
        uses: actions/cache@v6
        with:
          path: |
            C:\Program Files\Inno Setup 7
          key: innosetup-7.1.0

      - name: Install Inno Setup 7.1.0
        if: steps.cache-is.outputs.cache-hit != 'true'
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe"
          $installer = "$env:TEMP\innosetup-7.1.0-x64.exe"
          # 原料 pin：版本号 + SHA-256 双钉死；哈希不匹配即失败退出，不执行不可信安装包。
          # 注意：下方产物侧 sha256sum（version.txt 生成）不算满足本条。
          $expectedHash = "0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          $actualHash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            Write-Error "Inno Setup 安装包哈希不匹配: 预期 $expectedHash, 实际 $actualHash"
            exit 1
          }
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/DIR="C:\Program Files\Inno Setup 7"' -Wait

      - name: Resolve ISCC path
        # 唯一真值源：两段 ISCC 查找（语言文件目录定位、编译器调用）曾各写一份，
        # 现收口到此一步，下游经 outputs 引用，不再各自枚举候选路径。
        id: iscc
        run: |
          $candidatePaths = @(
            "C:\Program Files\Inno Setup 7",
            "C:\Program Files (x86)\Inno Setup 7"
          )
          $innoPath = ""
          foreach ($path in $candidatePaths) {
            if (Test-Path "$path\ISCC.exe") {
              $innoPath = $path
              break
            }
          }
          if (-not $innoPath) {
            $isccCmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($isccCmd) {
              $innoPath = Split-Path -Parent $isccCmd.Source
            }
          }
          if (-not $innoPath) {
            Write-Error "ISCC.exe not found!"
            exit 1
          }
          "path=$innoPath\ISCC.exe" >> $env:GITHUB_OUTPUT
          "dir=$innoPath" >> $env:GITHUB_OUTPUT

      - name: Download Chinese language file
        if: steps.cache-is.outputs.cache-hit != 'true'
        run: |
          $innoPath = "${{ steps.iscc.outputs.dir }}"
          $langDir = Join-Path $innoPath "Languages"
          if (-not (Test-Path $langDir)) {
            New-Item -ItemType Directory -Force -Path $langDir
          }
          # 语言文件 pin 到 40 位 commit SHA（非 main 分支）：上游更新需手动改 SHA 并同步评审。
          $url = "https://raw.githubusercontent.com/kira-96/Inno-Setup-Chinese-Simplified-Translation/1ff90acc4ed4aee82b1cda43253243deee3daed4/ChineseSimplified.isl"
          Invoke-WebRequest -Uri $url -OutFile (Join-Path $langDir "ChineseSimplified.isl") -UseBasicParsing

      - name: Compile installer
        run: |
          & "${{ steps.iscc.outputs.path }}" installer.iss

      - name: Generate version.txt
        shell: bash
        env:
          # 经 env 传入而非 ${{ }} 内插进脚本，与版本一致校验步骤同一口径（避免 tag 特殊字符注入）。
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          INSTALLER="Output/TrafficMonitor-Setup-${VERSION}.exe"
          HASH=$(sha256sum "$INSTALLER" | cut -d' ' -f1 | tr 'a-z' 'A-Z')
          printf "%s\n%s\n" "$VERSION" "$HASH" > version.txt

      # GitHub 原生 --generate-notes 只会列出两个 tag 之间 merge 的 PR；
      # 直接 push 到 main 的提交会被吞掉，只剩 Full Changelog。
      # 因此自行遍历 commits 生成 What's Changed：
      #   - squash 合并的 PR（message 以 (#N) 结尾）-> PR 链接条目
      #   - merge commit -> 取标题行 -> PR 链接条目
      #   - 其余直接提交 -> commit 链接条目
      #   - 过滤 release/docs/ci/test/chore 噪音（含 `docs(rfc):` 这类带 scope 的写法）
      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -z "$PREV_TAG" ]; then
            # 首个发布：回退到仓库首个提交
            PREV_TAG="$(git rev-list --max-parents=0 HEAD | head -n1)"
          fi
          echo "Range: ${PREV_TAG}...${TAG}"
          {
            echo "## What's Changed"
            gh api "repos/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}" --paginate \
              --jq '.commits[]
                | (.commit.message | split("\n")) as $lines
                | $lines[0] as $subject
                | select(($subject | test("^(release|docs|ci|test|chore)(\\([^)]*\\))?: ")) | not)
                | (if ($subject | test("^Merge pull request #[0-9]+ ")) and (($lines | length) > 2)
                   then $lines[2] else $subject end) as $title
                | select($title != "")
                | (if ($subject | test("\\(#[0-9]+\\)$")) then ($subject | capture("\\(#(?<pr>[0-9]+)\\)$").pr)
                   elif ($subject | test("^Merge pull request #[0-9]+")) then ($subject | capture("^Merge pull request #(?<pr>[0-9]+)").pr)
                   else "" end) as $pr
                | (.author.login // .commit.author.name // "unknown") as $author
                | [$title, $author, .sha, $pr]
                | @tsv' |
            while IFS=$'\t' read -r title author sha pr; do
              title="${title%$'\r'}" author="${author%$'\r'}" sha="${sha%$'\r'}" pr="${pr%$'\r'}"
              title="${title% (*)}"
              if [[ "$pr" =~ ^[0-9]+$ ]]; then
                echo "* ${title} by @${author} in https://github.com/${GITHUB_REPOSITORY}/pull/${pr}"
              else
                echo "* ${title} by @${author} in https://github.com/${GITHUB_REPOSITORY}/commit/${sha}"
              fi
            done
            echo
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
          } > release_notes.md
          echo "----- release_notes.md -----"
          cat release_notes.md

      # 发布顺序：draft → 上传三个资产 → 校验 → publish。
      # release 一旦创建就是 latest，而客户端读的是 releases/latest/download/version.txt；
      # 先 publish 再传资产会留下「客户端已读到新版号、安装包还在传」的 404 窗口
      # （gh release upload 是并发上传，资产顺序不构成原子性保证）。
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在（可能是上一轮失败留下的 draft），沿用。"
          else
            # --verify-tag：tag 不存在即失败，禁止 gh 从默认分支新建同名 tag。
            # 刻意不带 --latest：成为 latest 的动作推迟到资产校验通过之后。
            gh release create "${TAG}" --draft --verify-tag --title "${TAG}" --notes-file release_notes.md
          fi

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          # 用 github.event.inputs 而非 inputs：后者的上下文只在 workflow_dispatch /
          # 可复用工作流里可用，push tag 触发时可能求值失败，而发布工作流不能挂在这一点上。
          # push tag 触发时该属性不存在，按文档求值为空串，等同 false。
          REPAIR: ${{ github.event.inputs.repair }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ASSETS=(
            "target/release/traffic-monitor.exe#traffic-monitor.exe"
            "Output/TrafficMonitor-Setup-${VERSION}.exe#TrafficMonitor-Setup-${VERSION}.exe"
            "version.txt#version.txt"
          )

          if [ "${REPAIR:-false}" = "true" ]; then
            # 单独取变量：把命令替换写进 `[ ]` 会连 gh 的失败一起吞掉，把网络/鉴权故障
            # 误报成「已 publish」；单独赋值时 set -e 会照常中止脚本。
            DRAFT="$(gh release view "${TAG}" --json isDraft --jq '.isDraft')"
            # 已 publish 的 release 不允许 repair：删资产会让 latest 的下载链接短暂失效。
            if [ "${DRAFT}" != "true" ]; then
              echo "release ${TAG} 已 publish，repair 只对 draft 生效；请手工处理。" >&2
              exit 1
            fi
            EXISTING="$(gh release view "${TAG}" --json assets --jq '.assets[].name')"
            for asset in "${ASSETS[@]}"; do
              NAME="${asset##*#}"
              if printf '%s\n' "${EXISTING}" | grep -Fxq "${NAME}"; then
                echo "repair: 删除同名旧资产 ${NAME}"
                gh release delete-asset "${TAG}" "${NAME}" -y
              fi
            done
          fi

          # 默认路径不带覆盖能力：同名资产已存在时 gh 直接报错，这正是
          # 「同一 tag 的资产不可被静默替换」的意图；需要覆盖必须走 repair 入口。
          gh release upload "${TAG}" "${ASSETS[@]}"

      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          INSTALLER="Output/TrafficMonitor-Setup-${VERSION}.exe"

          # 三个资产必须都已落到 release 上，少一个就不许 publish：
          # 否则 latest 的 version.txt 会让客户端读到新版本号却下不到安装包。
          # 本步骤跑在 publish 之前，此时 release 还是 draft，所以这里刻意用 gh 而不是 gh api：
          # REST 的 releases/tags/<tag> 端点看不到 draft（cli/cli 为此专门加了 GraphQL 回落），
          # 而 gh release view/download 内部走的是带 draft 回落的 FetchRelease。
          LIST="$(gh release view "${TAG}" --json assets --jq '.assets[].name' | sort)"
          for name in "traffic-monitor.exe" "TrafficMonitor-Setup-${VERSION}.exe" "version.txt"; do
            if ! printf '%s\n' "${LIST}" | grep -Fxq "${name}"; then
              echo "资产缺失: ${name}" >&2
              exit 1
            fi
          done

          # 回读远端 version.txt（不信任本地刚写的那份）：首行必须等于三方一致的版本号，
          # 哈希行必须等于本地安装包的实际哈希，证明上传后的内容就是本次构建的产物。
          rm -rf verify_tmp && mkdir -p verify_tmp
          gh release download "${TAG}" -p version.txt -D verify_tmp
          REMOTE_VERSION="$(sed -n '1p' verify_tmp/version.txt | tr -d '\r')"
          REMOTE_HASH="$(sed -n '2p' verify_tmp/version.txt | tr -d '\r')"
          LOCAL_HASH="$(sha256sum "${INSTALLER}" | cut -d' ' -f1 | tr 'a-z' 'A-Z')"
          if [ "${REMOTE_VERSION}" != "${VERSION}" ]; then
            echo "version.txt 首行=${REMOTE_VERSION} 与版本号 ${VERSION} 不一致" >&2
            exit 1
          fi
          if [ "${REMOTE_HASH}" != "${LOCAL_HASH}" ]; then
            echo "version.txt 哈希=${REMOTE_HASH} 与安装包实际哈希=${LOCAL_HASH} 不一致" >&2
            exit 1
          fi
          echo "三个资产齐备，version.txt 与安装包哈希一致。"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 拆两步而不是一条 `--draft=false --latest`：REST 文档写明「Drafts and prereleases cannot
          # be set as latest」，而把两者合进同一个 PATCH 时服务端按哪个状态求值无法离线验证。
          # 两步各自都落在文档化用法上（发布 draft 就是 `--draft=false` 的官方示例），
          # 第二步执行时 release 已不是 draft，`--latest` 必然合法。
          gh release edit "${TAG}" --draft=false
          # 到这一步才让 release 成为 latest；draft 期间 releases/latest 仍指向上一版本。
          gh release edit "${TAG}" --latest
