name: Rust setup
description: 安装 Rust 工具链与 Cargo 缓存（check / release 共用；本地 action，调用前必须先 actions/checkout）

inputs:
  cache-key:
    description: Swatinem/rust-cache 的 shared-key
    required: true

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
